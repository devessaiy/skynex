<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | Skynex Solutions Limited</title>
  <meta name="description" content="Send an inquiry to Skynex Solutions Limited.">
  <link rel="icon" type="image/x-icon" href="/skynex-online.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="font-sans text-slate-900 dark:text-slate-100 bg-white dark:bg-neutral-900 antialiased selection:bg-skynex-dark selection:text-white">

  <!-- Shared header & footer are injected by js/core/app.js (single source: js/components/layout.js + js/config.js) -->
  <div id="site-header"></div>

  <main id="app-root" class="pt-20 md:pt-24 min-h-screen">
    <div class="page-view bg-white dark:bg-neutral-900">
          <section class="pt-24 pb-32">
            <div class="max-w-[1440px] mx-auto px-6 md:px-12 lg:px-20">
              <h1 class="text-5xl md:text-7xl font-bold text-skynex-dark dark:text-white tracking-tighter mb-16 text-center">Engage with Skynex.</h1>
              <div class="grid grid-cols-1 lg:grid-cols-2 gap-16 lg:gap-24">
                
                <div>
                  <h2 class="text-2xl font-bold text-skynex-dark dark:text-white mb-8">Send an Inquiry</h2>
                  <form data-contact-form class="space-y-8">
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Full Name</label>
                      <input data-contact-name type="text" required class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors" placeholder="Jane Doe">
                    </div>
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Email Address</label>
                      <input data-contact-email type="email" required class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors" placeholder="jane@company.com">
                    </div>
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Company Name</label>
                      <input data-contact-company type="text" class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors" placeholder="Company Ltd. (optional)">
                    </div>
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Service Needed</label>
                      <select data-contact-service required class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors">
                        <option value="" disabled selected>Select a service</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Custom App">Custom App</option>
                        <option value="Digital Marketing">Digital Marketing</option>
                        <option value="Branding">Branding</option>
                        <option value="Analytics & Reporting">Analytics &amp; Reporting</option>
                        <option value="Supply of Office Equipment">Supply of Office Equipment</option>
                        <option value="Other">Other</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Project Budget</label>
                      <select data-contact-budget required class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors">
                        <option value="" disabled selected>Select a budget range</option>
                        <option value="Under ₦500,000">Under ₦500,000</option>
                        <option value="₦500,000 - ₦2,000,000">₦500,000 - ₦2,000,000</option>
                        <option value="₦2,000,000 - ₦5,000,000">₦2,000,000 - ₦5,000,000</option>
                        <option value="₦5,000,000 - ₦10,000,000">₦5,000,000 - ₦10,000,000</option>
                        <option value="Above ₦10,000,000">Above ₦10,000,000</option>
                        <option value="Not sure yet">Not sure yet</option>
                      </select>
                    </div>
                    <div>
                      <label class="block text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Message or Requirement</label>
                      <textarea data-contact-message rows="4" required class="w-full bg-transparent border-b border-slate-300 py-3 text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors resize-none" placeholder="How can we assist your business?"></textarea>
                    </div>
                    <p data-contact-status class="text-sm font-medium hidden"></p>
                    <button type="submit" data-contact-submit class="px-10 py-4 bg-skynex-dark text-white text-sm font-bold tracking-widest uppercase rounded-full hover:bg-slate-800 transition-colors disabled:opacity-50">
                      Submit Message
                    </button>
                  </form>
                </div>
    
                <div class="bg-skynex-gray dark:bg-neutral-950 p-10 md:p-16 rounded-2xl">
                  <h2 class="text-2xl font-bold text-skynex-dark dark:text-white mb-10">Corporate Headquarters</h2>
                  <div class="space-y-8">
                    <div>
                      <p class="text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Address</p>
                      <p class="text-lg text-skynex-dark dark:text-white font-light leading-relaxed">KS Pawa Plaza,<br>Shuaibu Dagaci St.,<br>Suleja, Niger State,<br>Nigeria.</p>
                    </div>
                    <div>
                      <p class="text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Electronic Mail</p>
                      <a href="mailto:skynexsolutionslimited@gmail.com" class="text-lg text-skynex-blue hover:text-skynex-dark dark:text-white transition-colors">skynexsolutionslimited@gmail.com</a>
                    </div>
                    <div class="pt-8 border-t border-slate-200">
                      <p class="text-xs font-bold tracking-widest uppercase text-slate-500 dark:text-slate-400 dark:text-slate-500 mb-2">Corporate Registration</p>
                      <p class="text-lg text-skynex-dark dark:text-white font-light">CAC RC: 9757226</p>
                    </div>
                  </div>
                </div>
    
              </div>
            </div>
          </section>
        </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/components/ui.js" defer></script>
  <script src="/js/components/layout.js" defer></script>
  <script src="/js/core/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="/js/lib/supabase-client.js" defer></script>
  <script src="/js/pages/contact.js" defer></script>
</body>
</html>
