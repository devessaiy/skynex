<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Set a New Password | Skynex Solutions Limited</title>
  <meta name="description" content="Set a new password for your Skynex staff account.">
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/x-icon" href="/skynex-online.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="font-sans text-slate-900 dark:text-slate-100 bg-white dark:bg-neutral-900 antialiased selection:bg-skynex-dark selection:text-white">

  <!-- Shared header & footer are injected by js/core/app.js (single source: js/components/layout.js + js/config.js) -->
  <div id="site-header"></div>

  <main id="app-root" class="pt-20 md:pt-24 min-h-screen">
    <div class="page-view min-h-screen flex items-center justify-center bg-skynex-gray dark:bg-neutral-950 px-6 py-16">
          <div class="w-full max-w-md bg-white dark:bg-neutral-900 border border-skynex-border dark:border-neutral-800 rounded-2xl p-8 md:p-10">
            <h1 class="text-2xl font-bold text-skynex-dark dark:text-white tracking-tighter mb-2">Set a New Password</h1>
            <p class="text-sm text-slate-500 dark:text-slate-400 font-light mb-8">Choose a new password for your staff account.</p>
    
            <form data-newpass-form class="space-y-5">
              <div>
                <label class="block text-xs font-bold uppercase tracking-widest text-slate-500 dark:text-slate-400 mb-2">New Password</label>
                <input data-newpass type="password" minlength="8" required autocomplete="new-password"
                  class="w-full border border-skynex-border dark:border-neutral-800 rounded-lg px-4 py-3 text-base text-skynex-dark dark:text-white focus:outline-none focus:border-skynex-dark transition-colors" />
              </div>
              <p data-newpass-message class="text-sm font-medium hidden"></p>
              <button type="submit" data-newpass-submit
                class="w-full bg-skynex-dark text-white font-bold uppercase tracking-widest text-xs py-4 rounded-full hover:bg-skynex-blue transition-colors">
                Update Password
              </button>
            </form>
          </div>
        </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/components/ui.js" defer></script>
  <script src="/js/components/layout.js" defer></script>
  <script src="/js/core/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" defer></script>
  <script src="/js/lib/supabase-client.js" defer></script>
  <script src="/js/core/auth.js" defer></script>
  <script src="/js/pages/staff-reset-password.js" defer></script>
</body>
</html>
