<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skynex Solutions Limited | Official Corporate Website</title>
   <link rel="icon" type="image/x-icon" href="skynex-online.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            skynex: {
              blue: '#1976D2',
              teal: '#26A69A',
              dark: '#050505',     // True premium black
              gray: '#f5f5f7',     // Apple/Samsung style surface gray
              border: '#e5e5e5'    // Crisp, subtle structural border
            }
          },
          letterSpacing: {
            tightest: '-.04em',
            tighter: '-.02em',
          }
        }
      }
    }
  </script>
  <style>
    /* Premium custom scrollbar */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #ffffff; }
    ::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #a1a1aa; }

    /* Subtle Text Gradient for Accents */
    .text-gradient {
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-image: linear-gradient(to right, #1976D2, #26A69A);
    }

    /* Sophisticated Underline Hover */
    .nav-link {
      position: relative;
      color: #050505;
      transition: color 0.3s ease;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      width: 100%;
      transform: scaleX(0);
      height: 1px;
      bottom: -4px;
      left: 0;
      background-color: #050505;
      transform-origin: bottom right;
      transition: transform 0.4s cubic-bezier(0.86, 0, 0.07, 1);
    }
    .nav-link:hover::after,
    .nav-link.active::after {
      transform: scaleX(1);
      transform-origin: bottom left;
    }

    /* SPA View Transitions */
    .spa-view {
      display: none;
      opacity: 0;
      transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .spa-view.active {
      display: block;
      opacity: 1;
      animation: fadeInView 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes fadeInView {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Utility for structural grid lists */
    .structural-list>div { border-bottom: 1px solid #e5e5e5; }
    .structural-list>div:last-child { border-bottom: none; }
  </style>
</head>

<body class="font-sans text-slate-900 bg-white antialiased selection:bg-skynex-dark selection:text-white">

  <div id="app"></div>

  <!--
    Scripts are plain classic scripts (no build step, no framework, works from file:// too).
    Core files are needed on every screen. Only the landing screen (Home) is loaded up front so
    the first paint is identical to before; every other screen is fetched on demand by
    js/core/router.js the first time it is visited.
  -->
  <script src="js/config.js" defer></script>
  <script src="js/components/ui.js" defer></script>
  <script src="js/components/layout.js" defer></script>
  <script src="js/core/router.js" defer></script>
  <script src="js/core/app.js" defer></script>

  <!-- Landing screen (eager) -->
  <script src="js/views/home.js" defer></script>
  <script src="js/features/trideta-video.js" defer></script>
</body>
</html>
