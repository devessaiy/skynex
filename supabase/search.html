<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Search | Skynex Solutions Limited</title>
  <meta name="description" content="Search Skynex products, services, news and company information.">
  <meta name="robots" content="noindex, follow">
  <link rel="icon" type="image/x-icon" href="/skynex-online.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="font-sans text-slate-900 dark:text-slate-100 bg-white dark:bg-neutral-900 antialiased selection:bg-skynex-dark selection:text-white">

  <div id="site-header"></div>

  <main id="app-root" class="pt-20 md:pt-24 min-h-screen search-page__bg">
    <div class="search-page">
      <h1 id="search-title">Search</h1>
      <form class="hero-search" role="search" action="/search" method="get" data-site-search>
        <label for="search-q" class="sr-only">Search the Skynex website</label>
        <div class="hero-search__box">
          <svg class="hero-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search-q" name="q" type="search" maxlength="100" autocomplete="off" enterkeyhint="search" placeholder="Search products, services, news and more"
                 role="combobox" aria-expanded="false" aria-controls="search-q-list" aria-autocomplete="list">
          <button type="button" class="hero-search__clear" data-search-clear hidden aria-label="Clear search">&times;</button>
          <button type="submit" class="hero-search__go">Search</button>
        </div>
        <ul id="search-q-list" class="search-pop" role="listbox" aria-label="Search suggestions" hidden></ul>
        <p class="sr-only" role="status" aria-live="polite" data-search-status></p>
      </form>
      <div id="search-results" aria-live="polite"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/components/ui.js" defer></script>
  <script src="/js/components/layout.js" defer></script>
  <script src="/js/core/app.js" defer></script>
  <script src="/js/lib/public-api.js" defer></script>
  <script src="/js/lib/search.js" defer></script>
  <script src="/js/features/search-ui.js" defer></script>
  <script src="/js/pages/search.js" defer></script>
</body>
</html>
