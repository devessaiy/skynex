<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News | Skynex Solutions Limited</title>
  <meta name="description" content="Latest news and announcements from Skynex Solutions Limited.">
  <link rel="icon" type="image/x-icon" href="/skynex-online.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/site.css">
</head>

<body class="font-sans text-slate-900 bg-white antialiased selection:bg-skynex-dark selection:text-white">

  <!-- Shared header & footer are injected by js/core/app.js (single source: js/components/layout.js + js/config.js) -->
  <div id="site-header"></div>

  <main id="app-root" class="pt-20 md:pt-24 min-h-screen">
    <div class="page-view bg-white">
      <article class="max-w-3xl mx-auto px-6 py-12 md:py-20" id="news-post">
        <div class="animate-pulse space-y-4"><div class="h-8 w-3/4 bg-skynex-border/60"></div><div class="h-4 w-1/3 bg-skynex-border/60"></div><div class="aspect-video bg-skynex-border/60 rounded-2xl"></div></div>
      </article>
    </div>
  </main>

  <div id="site-footer"></div>

  <script src="/js/config.js" defer></script>
  <script src="/js/components/ui.js" defer></script>
  <script src="/js/components/layout.js" defer></script>
  <script src="/js/core/app.js" defer></script>

  <script src="/js/lib/public-api.js" defer></script>
  <script src="/js/pages/news-post.js" defer></script>
</body>
</html>
